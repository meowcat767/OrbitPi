plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm'
}

dependencies {
    api "org.jmonkeyengine:jme3-core:$jmonkeyengineVersion"
    api "org.jmonkeyengine:jme3-effects:$jmonkeyengineVersion"
    
    implementation "com.simsilica:lemur:1.16.0"
    implementation "com.simsilica:lemur-proto:1.13.0"
    implementation "com.github.stephengold:Minie:7.7.0"
    implementation "com.github.riccardobl.DDSWriter:dds_writer:1.3.2"
    implementation "com.github.Jeddic:particlemonkey:1.0.2"
    implementation "org.apache.logging.log4j:log4j-api:2.25.3"
    implementation "org.apache.logging.log4j:log4j-core:2.25.3"
    implementation "org.codehaus.groovy:groovy:3.0.21"
    implementation "org.codehaus.groovy:groovy-jsr223:3.0.21"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}
