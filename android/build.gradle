plugins {
    id 'com.android.application'
}

android {
    namespace 'site.meowcat'
    compileSdk 33

    defaultConfig {
        applicationId "site.meowcat"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    sourceSets {
        main {
            assets.srcDirs = ['../core/src/main/resources']
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':core')
    implementation "org.jmonkeyengine:jme3-android:$jmonkeyengineVersion"
    implementation "org.jmonkeyengine:jme3-android-native:$jmonkeyengineVersion"
}
